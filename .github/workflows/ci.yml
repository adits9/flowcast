name: FlowCast checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowcast
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: flowcast_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowcast -d flowcast_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '2'
      - run: pytest -q
        env:
          OMP_NUM_THREADS: '2'
          FLOWCAST_TEST_DATABASE_URL: postgresql+psycopg://flowcast:test-only@localhost:5432/flowcast_test
          FLOWCAST_TEST_REDIS_URL: redis://localhost:6379/15
      - run: npm ci && npm run build
        working-directory: frontend
